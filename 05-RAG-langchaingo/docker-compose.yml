# Milvus Standalone (official) + Ollama for local embeddings.
# Usage:
#   docker compose up -d
#   docker compose exec ollama ollama pull bge-m3
#
# Ports:
#   milvus  : 19530 (gRPC) / 9091 (health/metrics)
#   etcd    : 2379 (internal)
#   minio   : 9000 (s3 api) / 9001 (console)
#   ollama  : 11434 (api)

services:
  etcd:
    container_name: rag-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: rag-minio
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"      # web console
      - "9000:9000"      # s3 api
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: rag-milvus
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC (sdk)
      - "9091:9091"     # health/metrics
    depends_on:
      - "etcd"
      - "minio"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  ollama:
    container_name: rag-ollama
    image: ollama/ollama:0.5.7
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # On Apple Silicon, Ollama in Docker cannot access the GPU.
    # For local dev on macOS you may prefer running ollama natively
    # (`brew install ollama && ollama serve`) and disabling this service.
    restart: unless-stopped
    pull_policy: missing

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
